<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Speaker Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; max-width: 420px; width: 90%; border: 1px solid #334155; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    h2 { margin-bottom: 0.5rem; font-size: 1.5rem; }
    audio { width: 100%; margin: 1.5rem 0; }
    .status { font-size: 0.875rem; color: #94a3b8; font-weight: 500; }
    .status.online { color: #22c55e; }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>Sync Speaker Studio</h2>
    <p class="status" id="status">● Connecting to server...</p>

    <audio id="audioPlayer" controls>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    // Auto-connect to current domain (local or cloud host)
    const socket = io(window.location.origin);
    
    const audio = document.getElementById('audioPlayer');
    const status = document.getElementById('status');

    let isRemoteChange = false;

    socket.on('connect', () => {
      status.textContent = '● Connected & Synced';
      status.className = 'status online';
    });

    socket.on('disconnect', () => {
      status.textContent = '● Disconnected';
      status.className = 'status';
    });

    // Handle incoming events
    socket.on('play', (data) => {
      isRemoteChange = true;
      audio.currentTime = data.time;
      audio.play().then(() => { isRemoteChange = false; }).catch(() => { isRemoteChange = false; });
    });

    socket.on('pause', (data) => {
      isRemoteChange = true;
      audio.currentTime = data.time;
      audio.pause();
      isRemoteChange = false;
    });

    socket.on('seek', (data) => {
      isRemoteChange = true;
      audio.currentTime = data.time;
      isRemoteChange = false;
    });

    // Handle outgoing local user actions
    audio.addEventListener('play', () => {
      if (!isRemoteChange) socket.emit('play', { time: audio.currentTime });
    });

    audio.addEventListener('pause', () => {
      if (!isRemoteChange) socket.emit('pause', { time: audio.currentTime });
    });

    audio.addEventListener('seeked', () => {
      if (!isRemoteChange) socket.emit('seek', { time: audio.currentTime });
    });
  </script>
</body>
</html>
