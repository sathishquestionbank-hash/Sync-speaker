<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Speaker Studio</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: #c9d1d9; text-align: center; padding: 15px; }
        h1 { margin: 10px 0; color: #58a6ff; font-size: 22px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 15px; margin: 12px auto; max-width: 520px; text-align: left; }
        .center { text-align: center; }
        .status-val { font-weight: bold; color: #f2cc60; }
        .error-msg { color: #f85149; font-weight: bold; font-size: 13px; margin-top: 6px; display: none; }
        button { padding: 10px 14px; margin: 4px 0; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn-admin { background: #238636; color: white; }
        .btn-listener { background: #1f6feb; color: white; }
        .btn-play { background: #238636; color: white; margin-top: 8px; font-size: 15px; }
        .btn-pause { background: #da3633; color: white; font-size: 15px; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 3px; font-weight: 600; text-transform: uppercase; }
        input[type="range"] { width: 100%; margin: 3px 0; accent-color: #58a6ff; }
        input[type="password"], select, input[type="file"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; margin-bottom: 8px; font-size: 13px; }
        .info-text { font-size: 12px; color: #8b949e; }
        
        /* Connected Devices List */
        .device-card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .device-id { font-weight: bold; color: #58a6ff; }
        .eq-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
    </style>
</head>
<body>

    <h1>Sync Speaker Studio</h1>

    <!-- Network Info -->
    <div class="card center">
        <p>Role: <span id="role-display" class="status-val">Unassigned</span> | Status: <span id="status-display" class="status-val">Connecting...</span></p>
        <p id="latency-display" class="info-text" style="margin-top: 4px;">Latency: 0 ms</p>
    </div>

    <!-- Protected Role Selection -->
    <div id="role-selection" class="card">
        <h3 style="margin-bottom: 12px; text-align: center;">Device Authentication</h3>
        
        <div style="margin-bottom: 12px;">
            <label>Admin Password:</label>
            <input type="password" id="admin-passcode" placeholder="Default: 1234">
            <button class="btn-admin" onclick="joinAs('admin')">Login as Admin Controller</button>
        </div>

        <hr style="border-color: #30363d; margin: 12px 0;">

        <div style="margin-bottom: 6px;">
            <label>Listener Password:</label>
            <input type="password" id="listener-passcode" placeholder="Default: listenpass">
            <button class="btn-listener" onclick="joinAs('listener')">Join as Connected Listener</button>
        </div>

        <p id="auth-error-msg" class="error-msg center"></p>
    </div>

    <!-- Admin View: Device Management (Equalizer & Surround) -->
    <div id="admin-devices-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 8px; font-size: 15px;">📱 Connected Devices Manager</h3>
        <p class="info-text" style="margin-bottom: 10px;">Individual surround routing and 3-band EQ per speaker.</p>
        <div id="connected-devices-container">
            <p class="info-text">Scanning network for devices...</p>
        </div>
    </div>

    <!-- Admin Master Audio Controls -->
    <div id="admin-media-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 8px; font-size: 15px;">Admin Master Source</h3>
        <label>Upload Audio Track</label>
        <input type="file" id="audio-file-input" accept="audio/*" onchange="loadLocalAudioFile(event)">

        <div style="margin-top: 8px;">
            <button class="btn-play" onclick="sendAdminAction('play')">PLAY / RESYNC ALL</button>
            <button class="btn-pause" onclick="sendAdminAction('pause')">PAUSE ALL</button>
        </div>
    </div>

    <!-- Local Audio Element -->
    <audio id="audio-player" style="display: none;"></audio>

    <script>
        const socket = io();
        let currentRole = 'unassigned';
        let serverOffset = 0;

        const audioPlayer = document.getElementById('audio-player');
        let audioCtx, sourceNode, gainNode, bassFilter, midFilter, trebleFilter, stereoPanner;
        let isAudioInit = false;

        document.body.addEventListener('click', () => {
            if (!isAudioInit) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: false });

        function initAudio() {
            if (isAudioInit) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            gainNode = audioCtx.createGain();

            // 3-Band Equalizer Setup
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.value = 250;

            midFilter = audioCtx.createBiquadFilter();
            midFilter.type = 'peaking';
            midFilter.frequency.value = 1500;
            midFilter.Q.value = 1.0;

            trebleFilter = audioCtx.createBiquadFilter();
            trebleFilter.type = 'highshelf';
            trebleFilter.frequency.value = 4000;

            if (audioCtx.createStereoPanner) {
                stereoPanner = audioCtx.createStereoPanner();
            }

            // Chain: Source -> Bass -> Mid -> Treble -> Panner -> Gain -> Out
            sourceNode.connect(bassFilter);
            bassFilter.connect(midFilter);
            midFilter.connect(trebleFilter);

            let lastNode = trebleFilter;
            if (stereoPanner) {
                trebleFilter.connect(stereoPanner);
                lastNode = stereoPanner;
            }

            lastNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            isAudioInit = true;
        }

        // Join Role
        function joinAs(role) {
            const password = role === 'admin' 
                ? document.getElementById('admin-passcode').value 
                : document.getElementById('listener-passcode').value;

            document.getElementById('auth-error-msg').style.display = 'none';
            socket.emit('register-role', { role: role, password: password });
        }

        socket.on('role-assigned', (data) => {
            if (!data.success) {
                const errorEl = document.getElementById('auth-error-msg');
                errorEl.innerText = data.message;
                errorEl.style.display = 'block';
                return;
            }

            currentRole = data.role;
            document.getElementById('role-display').innerText = data.role.toUpperCase();
            document.getElementById('status-display').innerText = 'Connected';
            document.getElementById('role-selection').style.display = 'none';

            if (data.role === 'admin') {
                document.getElementById('admin-media-card').style.display = 'block';
                document.getElementById('admin-devices-card').style.display = 'block';
            }
        });

        // Admin: Render Connected Devices List & Per-Device Controls
        socket.on('device-list-update', (devices) => {
            if (currentRole !== 'admin') return;

            const container = document.getElementById('connected-devices-container');
            if (devices.length === 0) {
                container.innerHTML = '<p class="info-text">No connected devices.</p>';
                return;
            }

            container.innerHTML = devices.map(dev => `
                <div class="device-card">
                    <div class="device-header">
                        <span class="device-id">${dev.id.substring(0, 6)}... (${dev.role.toUpperCase()})</span>
                        <span class="info-text">Ping: ${dev.latency}ms</span>
                    </div>

                    <div style="margin-top: 6px;">
                        <label>Surround Channel</label>
                        <select onchange="updateDeviceDSP('${dev.id}', 'channel', this.value)">
                            <option value="center" ${dev.channel === 'center' ? 'selected' : ''}>Center / Stereo</option>
                            <option value="left" ${dev.channel === 'left' ? 'selected' : ''}>Left Channel</option>
                            <option value="right" ${dev.channel === 'right' ? 'selected' : ''}>Right Channel</option>
                            <option value="sub" ${dev.channel === 'sub' ? 'selected' : ''}>Bass Subwoofer</option>
                        </select>
                    </div>

                    <div style="margin-top: 4px;">
                        <label>Individual Gain Volume</label>
                        <input type="range" min="0" max="1" step="0.05" value="${dev.volume}" onchange="updateDeviceDSP('${dev.id}', 'volume', parseFloat(this.value))">
                    </div>

                    <label style="margin-top: 6px;">3-Band Equalizer (dB)</label>
                    <div class="eq-grid">
                        <div>
                            <label>Bass</label>
                            <input type="range" min="-12" max="12" value="${dev.eq.bass}" onchange="updateDeviceEQ('${dev.id}', 'bass', this.value)">
                        </div>
                        <div>
                            <label>Mid</label>
                            <input type="range" min="-12" max="12" value="${dev.eq.mid}" onchange="updateDeviceEQ('${dev.id}', 'mid', this.value)">
                        </div>
                        <div>
                            <label>Treble</label>
                            <input type="range" min="-12" max="12" value="${dev.eq.treble}" onchange="updateDeviceEQ('${dev.id}', 'treble', this.value)">
                        </div>
                    </div>
                </div>
            `).join('');
        });

        function updateDeviceDSP(targetId, key, value) {
            const payload = { targetDeviceId: targetId };
            payload[key] = value;
            socket.emit('admin-target-device-dsp', payload);
        }

        function updateDeviceEQ(targetId, band, val) {
            const devCard = document.querySelector(`[onchange*="${targetId}"]`);
            socket.emit('admin-target-device-dsp', {
                targetDeviceId: targetId,
                eq: {
                    bass: band === 'bass' ? parseFloat(val) : 0,
                    mid: band === 'mid' ? parseFloat(val) : 0,
                    treble: band === 'treble' ? parseFloat(val) : 0
                }
            });
        }

        // Apply Custom DSP targeted from Admin
        socket.on('apply-custom-dsp', (dsp) => {
            if (!isAudioInit) initAudio();

            // Channel Surround
            if (stereoPanner) {
                if (dsp.channel === 'left') stereoPanner.pan.value = -1;
                else if (dsp.channel === 'right') stereoPanner.pan.value = 1;
                else stereoPanner.pan.value = 0;
            }

            // Volume
            if (dsp.volume !== undefined) gainNode.gain.value = dsp.volume;

            // Equalizer
            if (dsp.eq) {
                bassFilter.gain.value = dsp.eq.bass || 0;
                midFilter.gain.value = dsp.eq.mid || 0;
                trebleFilter.gain.value = dsp.eq.treble || 0;
            }
        });

        // Time synchronization
        setInterval(() => {
            const start = Date.now();
            socket.emit('time-sync-ping', start);
        }, 4000);

        socket.on('time-sync-pong', (data) => {
            const now = Date.now();
            const rtt = now - data.clientTime;
            serverOffset = (data.serverTime + (rtt / 2)) - now;
            document.getElementById('latency-display').innerText = `Latency: ${Math.round(rtt / 2)} ms`;
            socket.emit('report-latency', rtt / 2);
        });

        // Audio Controls
        function loadLocalAudioFile(e) {
            const file = e.target.files[0];
            if (file) audioPlayer.src = URL.createObjectURL(file);
        }

        function sendAdminAction(action) {
            if (currentRole !== 'admin') return;
            socket.emit('admin-audio-action', {
                action: action,
                timestamp: Date.now() + serverOffset,
                seekPosition: audioPlayer.currentTime || 0
            });
        }

        socket.on('audio-sync-receive', async (data) => {
            if (!isAudioInit) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

            if (data.action === 'play') {
                const now = Date.now() + serverOffset;
                const passed = (now - data.startTimestamp) / 1000;
                audioPlayer.currentTime = Math.max(0, data.seekPosition + passed);
                audioPlayer.play().catch(e => console.log(e));
            } else {
                audioPlayer.pause();
            }
        });
    </script>
</body>
</html>
