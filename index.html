<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Speaker Studio - Ultra</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: #c9d1d9; text-align: center; padding: 15px; transition: background 0.2s; }
        h1 { margin: 8px 0; color: #58a6ff; font-size: 22px; }
        .card { background: rgba(22, 27, 34, 0.95); border: 1px solid #30363d; border-radius: 10px; padding: 14px; margin: 10px auto; max-width: 540px; text-align: left; }
        .center { text-align: center; }
        .status-val { font-weight: bold; color: #f2cc60; }
        .error-msg { color: #f85149; font-weight: bold; font-size: 13px; margin-top: 6px; display: none; }
        button { padding: 10px 14px; margin: 4px 0; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-admin { background: #238636; color: white; }
        .btn-listener { background: #1f6feb; color: white; }
        .btn-play { background: #238636; color: white; margin-top: 6px; }
        .btn-pause { background: #da3633; color: white; }
        .btn-mic { background: #8957e5; color: white; font-size: 14px; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 3px; font-weight: 600; text-transform: uppercase; }
        input[type="range"] { width: 100%; margin: 3px 0; accent-color: #58a6ff; }
        input[type="text"], input[type="password"], select, input[type="file"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; margin-bottom: 8px; font-size: 13px; }
        .info-text { font-size: 12px; color: #8b949e; }
        
        .device-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 12px; }
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .device-id { font-weight: bold; color: #58a6ff; }
        .eq-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
        .canvas-spectrum { width: 100%; height: 35px; background: #161b22; border-radius: 4px; margin-top: 6px; }
        
        #spatial-canvas { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; width: 100%; height: 200px; cursor: crosshair; }
        .timeline-container { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .timeline-time { font-size: 11px; font-family: monospace; color: #8b949e; }
        .playlist-container { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; max-height: 140px; overflow-y: auto; margin-top: 8px; }
        .playlist-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #21262d; font-size: 12px; cursor: pointer; }
        .playlist-item.active { background: #1f6feb22; border-left: 3px solid #58a6ff; font-weight: bold; color: #58a6ff; }
    </style>
</head>
<body>

    <h1>Sync Speaker Studio Ultra</h1>

    <div class="card center">
        <p>Room: <span id="room-display" class="status-val">MainStudio</span> | Role: <span id="role-display" class="status-val">Unassigned</span></p>
        <p id="latency-display" class="info-text" style="margin-top: 4px;">Latency: 0 ms | Drift: 0ms</p>
    </div>

    <div id="role-selection" class="card">
        <label>Room Name:</label>
        <input type="text" id="room-id-input" value="MainStudio">
        <label>Admin Passcode:</label>
        <input type="password" id="admin-passcode" placeholder="Default: 1234">
        <button class="btn-admin" onclick="joinAs('admin')">Join as Studio Controller</button>
        <hr style="border-color:#30363d; margin:10px 0;">
        <label>Listener Passcode:</label>
        <input type="password" id="listener-passcode" placeholder="Default: listenpass">
        <button class="btn-listener" onclick="joinAs('listener')">Join as Speaker Node</button>
        <p id="auth-error-msg" class="error-msg center"></p>
    </div>

    <div id="spatial-map-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 6px; font-size: 15px;">🌐 Interactive 2D Spatial Positioning</h3>
        <p class="info-text" style="margin-bottom: 8px;">Drag nodes around the central audio transmitter to adjust real-time stereo panning.</p>
        <canvas id="spatial-canvas" width="500" height="200"></canvas>
    </div>

    <div id="admin-devices-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 8px; font-size: 15px;">📱 Connected Nodes</h3>
        <div id="connected-devices-container"></div>
    </div>

    <div id="admin-media-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 8px; font-size: 15px;">🎼 Master Controller & DJ Paging</h3>
        
        <button id="mic-btn" class="btn-mic" onmousedown="startMicPaging()" onmouseup="stopMicPaging()" onmouseleave="stopMicPaging()">🎙️ Hold to Speak (Live DJ Page)</button>

        <label style="margin-top: 10px;">Queue Tracks</label>
        <input type="file" id="audio-file-input" accept="audio/*" multiple onchange="addFilesToPlaylist(event)">

        <div id="playlist-container" class="playlist-container"></div>

        <div class="timeline-container">
            <span id="curr-time-display" class="timeline-time">00:00</span>
            <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1" onchange="seekTrack(this.value)">
            <span id="total-time-display" class="timeline-time">00:00</span>
        </div>

        <div style="margin-top: 8px; display: flex; gap: 6px;">
            <button class="btn-play" onclick="sendAdminAction('play')">PLAY</button>
            <button class="btn-pause" onclick="sendAdminAction('pause')">PAUSE</button>
        </div>
    </div>

    <div class="card center">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="margin: 0;">Audio Visualizer Mode</label>
            <select id="vis-mode-select" style="width: auto; margin:0;" onchange="visMode = this.value">
                <option value="bars">Frequency Bars</option>
                <option value="radial">Radial Pulse</option>
                <option value="waveform">Oscilloscope Wave</option>
            </select>
        </div>
        <canvas id="local-spectrum-canvas" width="300" height="80" style="background:#0d1117; border-radius:6px; width:100%;"></canvas>
    </div>

    <audio id="audio-player" style="display: none;"></audio>

    <script>
        const socket = io();
        let currentRole = 'unassigned';
        let currentRoomId = 'MainStudio';
        let serverOffset = 0;

        const audioPlayer = document.getElementById('audio-player');
        let audioCtx, sourceNode, gainNode, bassFilter, midFilter, trebleFilter, stereoPanner, analyserNode;
        let isAudioInit = false;

        let localFileStore = [];
        let activePlaylist = [];
        let activeTrackIndex = -1;
        let connectedDevices = [];
        let visMode = 'bars';
        let micMediaRecorder, micStream;

        document.body.addEventListener('click', () => {
            if (!isAudioInit) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: false });

        function initAudio() {
            if (isAudioInit) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            gainNode = audioCtx.createGain();
            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 128;

            bassFilter = audioCtx.createBiquadFilter(); bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 200;
            midFilter = audioCtx.createBiquadFilter(); midFilter.type = 'peaking'; midFilter.frequency.value = 1000;
            trebleFilter = audioCtx.createBiquadFilter(); trebleFilter.type = 'highshelf'; trebleFilter.frequency.value = 3000;

            if (audioCtx.createStereoPanner) stereoPanner = audioCtx.createStereoPanner();

            sourceNode.connect(bassFilter);
            bassFilter.connect(midFilter);
            midFilter.connect(trebleFilter);
            trebleFilter.connect(analyserNode);

            let lastNode = analyserNode;
            if (stereoPanner) { analyserNode.connect(stereoPanner); lastNode = stereoPanner; }
            lastNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            isAudioInit = true;
            renderVisualizerEngine();
        }

        // Live Mic DJ Paging
        async function startMicPaging() {
            if (currentRole !== 'admin') return;
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micMediaRecorder = new MediaRecorder(micStream);
                socket.emit('admin-mic-state', true);

                micMediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) socket.emit('admin-mic-stream', e.data);
                };
                micMediaRecorder.start(100);
                document.getElementById('mic-btn').style.background = "#da3633";
            } catch (err) {
                console.error("Microphone Access Error:", err);
            }
        }

        function stopMicPaging() {
            if (currentRole !== 'admin' || !micMediaRecorder) return;
            if (micMediaRecorder.state !== 'inactive') {
                micMediaRecorder.stop();
                micStream.getTracks().forEach(track => track.stop());
                socket.emit('admin-mic-state', false);
                document.getElementById('mic-btn').style.background = "#8957e5";
            }
        }

        socket.on('listener-mic-ducking', (isSpeaking) => {
            if (gainNode) gainNode.gain.value = isSpeaking ? 0.3 : 1.0;
        });

        // 3-Mode Visualizer Engine
        function renderVisualizerEngine() {
            requestAnimationFrame(renderVisualizerEngine);
            if (!analyserNode) return;

            const canvas = document.getElementById('local-spectrum-canvas');
            const ctx = canvas.getContext('2d');
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (visMode === 'bars') {
                analyserNode.getByteFrequencyData(dataArray);
                const barWidth = (canvas.width / bufferLength) - 1;
                let x = 0;
                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * canvas.height;
                    ctx.fillStyle = `hsl(${200 + i * 8}, 80%, 60%)`;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            } else if (visMode === 'radial') {
                analyserNode.getByteFrequencyData(dataArray);
                const centerX = canvas.width / 2, centerY = canvas.height / 2;
                const radius = Math.min(centerX, centerY) - 10;
                ctx.beginPath();
                ctx.arc(centerX, centerY, Math.max(5, (dataArray[2] / 255) * radius), 0, 2 * Math.PI);
                ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 3; ctx.stroke();
            } else if (visMode === 'waveform') {
                analyserNode.getByteTimeDomainData(dataArray);
                ctx.lineWidth = 2; ctx.strokeStyle = "#238636"; ctx.beginPath();
                const sliceWidth = canvas.width / bufferLength;
                let x = 0;
                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = (v * canvas.height) / 2;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke();
            }

            const compressed = Array.from(dataArray.slice(0, 16));
            socket.emit('device-spectrum-stream', compressed);
        }

        // Auth
        function joinAs(role) {
            currentRoomId = document.getElementById('room-id-input').value || 'MainStudio';
            const password = role === 'admin' ? document.getElementById('admin-passcode').value : document.getElementById('listener-passcode').value;
            socket.emit('register-role', { role: role, password: password, roomId: currentRoomId });
        }

        socket.on('role-assigned', (data) => {
            if (!data.success) {
                const errorEl = document.getElementById('auth-error-msg');
                errorEl.innerText = data.message; errorEl.style.display = 'block';
                return;
            }
            currentRole = data.role;
            document.getElementById('room-display').innerText = data.roomId;
            document.getElementById('role-display').innerText = data.role.toUpperCase();
            document.getElementById('role-selection').style.display = 'none';

            if (data.role === 'admin') {
                document.getElementById('admin-media-card').style.display = 'block';
                document.getElementById('admin-devices-card').style.display = 'block';
                document.getElementById('spatial-map-card').style.display = 'block';
                initSpatialCanvas();
            }
        });

        // Interactive 2D Canvas Mapping
        function initSpatialCanvas() {
            const canvas = document.getElementById('spatial-canvas');
            const ctx = canvas.getContext('2d');
            let draggedNode = null;

            function drawMap() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const cX = canvas.width / 2, cY = canvas.height / 2;

                // Center Audio Source
                ctx.fillStyle = "#8957e5"; ctx.beginPath(); ctx.arc(cX, cY, 10, 0, 2 * Math.PI); ctx.fill();

                connectedDevices.forEach(dev => {
                    const nx = cX + (dev.posX || 0) * (canvas.width / 2.5);
                    const ny = cY + (dev.posY || 0) * (canvas.height / 2.5);

                    ctx.fillStyle = dev.id === socket.id ? "#238636" : "#58a6ff";
                    ctx.beginPath(); ctx.arc(nx, ny, 8, 0, 2 * Math.PI); ctx.fill();
                    ctx.fillStyle = "#c9d1d9"; ctx.font = "10px sans-serif";
                    ctx.fillText(dev.id.substring(0, 4), nx - 10, ny - 12);
                });
            }

            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                const cX = canvas.width / 2, cY = canvas.height / 2;

                connectedDevices.forEach(dev => {
                    const nx = cX + (dev.posX || 0) * (canvas.width / 2.5);
                    const ny = cY + (dev.posY || 0) * (canvas.height / 2.5);
                    if (Math.hypot(mx - nx, my - ny) < 12) draggedNode = dev;
                });
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!draggedNode) return;
                const rect = canvas.getBoundingClientRect();
                const cX = canvas.width / 2, cY = canvas.height / 2;
                const normX = (e.clientX - rect.left - cX) / (canvas.width / 2.5);
                const normY = (e.clientY - rect.top - cY) / (canvas.height / 2.5);

                draggedNode.posX = Math.max(-1, Math.min(1, normX));
                draggedNode.posY = Math.max(-1, Math.min(1, normY));

                socket.emit('admin-update-node-position', {
                    targetDeviceId: draggedNode.id,
                    x: draggedNode.posX,
                    y: draggedNode.posY
                });
                drawMap();
            });

            window.addEventListener('mouseup', () => draggedNode = null);
            setInterval(drawMap, 200);
        }

        socket.on('apply-spatial-position', (pos) => {
            if (stereoPanner) stereoPanner.pan.value = Math.max(-1, Math.min(1, pos.x));
        });

        // Playlist & Device Monitor
        function addFilesToPlaylist(e) {
            const files = Array.from(e.target.files);
            const trackMetas = [];
            files.forEach(file => {
                localFileStore.push(file);
                trackMetas.push({ name: file.name, duration: 0 });
            });
            socket.emit('admin-add-to-playlist', trackMetas);
        }

        socket.on('playlist-update', (data) => {
            activePlaylist = data.playlist; activeTrackIndex = data.currentIndex;
            const container = document.getElementById('playlist-container');
            container.innerHTML = activePlaylist.map((t, i) => `
                <div class="playlist-item ${i === activeTrackIndex ? 'active' : ''}" onclick="playTrackIndex(${i})">
                    <span>${i + 1}. ${t.name}</span>
                </div>
            `).join('');
        });

        function playTrackIndex(idx) {
            if (currentRole !== 'admin') return;
            if (localFileStore[idx]) audioPlayer.src = URL.createObjectURL(localFileStore[idx]);
            socket.emit('admin-select-track', idx);
        }

        socket.on('device-list-update', (devices) => {
            connectedDevices = devices;
            if (currentRole !== 'admin') return;
            const container = document.getElementById('connected-devices-container');
            container.innerHTML = devices.map(dev => `
                <div class="device-card">
                    <div class="device-header">
                        <span class="device-id">${dev.id.substring(0,6)} (${dev.zone || 'Main'})</span>
                        <span class="info-text">${dev.latency}ms</span>
                    </div>
                    <div class="eq-grid">
                        <div><label>Bass</label><input type="range" min="-12" max="12" value="${dev.eq.bass}" onchange="updateDeviceEQ('${dev.id}', 'bass', this.value)"></div>
                        <div><label>Mid</label><input type="range" min="-12" max="12" value="${dev.eq.mid}" onchange="updateDeviceEQ('${dev.id}', 'mid', this.value)"></div>
                        <div><label>Treble</label><input type="range" min="-12" max="12" value="${dev.eq.treble}" onchange="updateDeviceEQ('${dev.id}', 'treble', this.value)"></div>
                    </div>
                </div>
            `).join('');
        });

        function updateDeviceEQ(targetId, band, val) {
            const eqObj = {}; eqObj[band] = parseFloat(val);
            socket.emit('admin-target-device-dsp', { targetDeviceId: targetId, eq: eqObj });
        }

        socket.on('apply-custom-dsp', (dsp) => {
            if (!isAudioInit) initAudio();
            if (dsp.isMuted) gainNode.gain.value = 0;
            else if (dsp.volume !== undefined) gainNode.gain.value = dsp.volume;
            if (dsp.eq) {
                if (dsp.eq.bass !== undefined) bassFilter.gain.value = dsp.eq.bass;
                if (dsp.eq.mid !== undefined) midFilter.gain.value = dsp.eq.mid;
                if (dsp.eq.treble !== undefined) trebleFilter.gain.value = dsp.eq.treble;
            }
        });

        // Adaptive Clock Drift Compensation Sync Loop
        setInterval(() => {
            socket.emit('time-sync-ping', Date.now());
        }, 3000);

        socket.on('time-sync-pong', (data) => {
            const now = Date.now();
            const rtt = now - data.clientTime;
            serverOffset = (data.serverTime + (rtt / 2)) - now;
            socket.emit('report-latency', rtt / 2);
        });

        function sendAdminAction(action) {
            if (currentRole !== 'admin') return;
            socket.emit('admin-audio-action', {
                action: action,
                timestamp: Date.now() + serverOffset,
                seekPosition: audioPlayer.currentTime || 0
            });
        }

        socket.on('audio-sync-receive', async (data) => {
            if (!isAudioInit) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

            if (data.action === 'play-track-index' || data.action === 'play') {
                if (data.index !== undefined && localFileStore[data.index]) {
                    audioPlayer.src = URL.createObjectURL(localFileStore[data.index]);
                }
                const now = Date.now() + serverOffset;
                const expectedTime = Math.max(0, data.seekPosition + ((now - data.startTimestamp) / 1000));
                
                // Adaptive Rate Correction Algorithm
                const drift = expectedTime - audioPlayer.currentTime;
                document.getElementById('latency-display').innerText = `Drift: ${Math.round(drift * 1000)}ms`;

                if (Math.abs(drift) > 0.15) {
                    audioPlayer.currentTime = expectedTime;
                } else if (drift > 0.02) {
                    audioPlayer.playbackRate = 1.02; // Micro acceleration
                } else if (drift < -0.02) {
                    audioPlayer.playbackRate = 0.98; // Micro deceleration
                } else {
                    audioPlayer.playbackRate = 1.0;
                }

                audioPlayer.play().catch(e => console.log(e));
            } else {
                audioPlayer.pause();
            }
        });
    </script>
</body>
</html>
