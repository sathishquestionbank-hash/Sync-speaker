<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Speaker Studio</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: #c9d1d9; text-align: center; padding: 15px; }
        h1 { margin: 10px 0; color: #58a6ff; font-size: 22px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 15px; margin: 12px auto; max-width: 480px; text-align: left; }
        .center { text-align: center; }
        .status-val { font-weight: bold; color: #f2cc60; }
        .error-msg { color: #f85149; font-weight: bold; font-size: 13px; margin-top: 6px; display: none; }
        button { padding: 12px 16px; margin: 6px 0; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn-admin { background: #238636; color: white; }
        .btn-listener { background: #1f6feb; color: white; }
        .btn-play { background: #238636; color: white; margin-top: 8px; font-size: 16px; }
        .btn-pause { background: #da3633; color: white; font-size: 16px; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-resync { background: #8957e5; color: white; margin-top: 6px; }
        .control-group { margin: 12px 0; }
        label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        input[type="range"] { width: 100%; margin: 4px 0; accent-color: #58a6ff; }
        input[type="password"], input[type="text"], select, input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; margin-bottom: 8px; }
        .info-text { font-size: 12px; color: #8b949e; }
        
        #visualizer-canvas {
            display: block;
            margin: 0 auto 10px auto;
            border-radius: 12px;
            background: rgba(13, 17, 23, 0.8);
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
        }
        #yt-player-container { display: none; }
    </style>
</head>
<body>

    <h1>Sync Speaker Studio</h1>

    <!-- Audio Reactive Visualizer -->
    <canvas id="visualizer-canvas" width="280" height="130"></canvas>

    <!-- Network Status Info -->
    <div class="card center">
        <p>Role: <span id="role-display" class="status-val">Unassigned</span> | Status: <span id="status-display" class="status-val">Connecting...</span></p>
        <p id="stats-display" class="info-text" style="margin-top: 4px;">Devices: 0 | Admins: 0/2</p>
        <p id="latency-display" class="info-text">Latency Offset: 0 ms</p>
    </div>

    <!-- Device Role Selection -->
    <div id="role-selection" class="card center">
        <h3 style="margin-bottom: 12px;">Select Device Role</h3>
        
        <div style="margin-bottom: 10px;">
            <label style="text-align: left;">Admin Passcode Required:</label>
            <input type="password" id="admin-passcode" placeholder="Enter Admin Password (Default: 1234)">
            <button class="btn-admin" onclick="joinAs('admin')">Login as Admin (Controller)</button>
            <p id="auth-error-msg" class="error-msg">Authentication Failed: Incorrect Password</p>
        </div>

        <hr style="border-color: #30363d; margin: 15px 0;">

        <button class="btn-listener" onclick="joinAs('listener')">Join as Listener</button>
    </div>

    <!-- Admin Only: Music Selection & Controls -->
    <div id="admin-media-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 10px; font-size: 15px;">Admin Master Music Source</h3>
        
        <label>Option A: Local Audio Upload</label>
        <input type="file" id="audio-file-input" accept="audio/*" onchange="loadLocalAudioFile(event)">

        <hr style="border-color: #30363d; margin: 12px 0;">

        <label>Option B: YouTube / Shorts Link</label>
        <input type="text" id="yt-url-input" placeholder="e.g. https://youtube.com/shorts/s4tm8Ly3col">
        <button class="btn-secondary" onclick="loadYouTubeSong()">Load YouTube / Shorts Song</button>

        <div style="margin-top: 12px;">
            <label>Playback Speed Multiplier</label>
            <select id="speed-select" onchange="changePlaybackRate(this.value)">
                <option value="0.5">0.5x Slow</option>
                <option value="1.0" selected>1.0x Normal Speed</option>
                <option value="1.25">1.25x Speed</option>
                <option value="1.5">1.5x Speed</option>
                <option value="2.0">2.0x Fast</option>
            </select>
        </div>

        <div style="margin-top: 12px;">
            <label>Master Sync Actions</label>
            <button class="btn-play" onclick="sendAdminAction('play')">PLAY / RESYNC ALL DEVICES</button>
            <button class="btn-pause" onclick="sendAdminAction('pause')">PAUSE ALL DEVICES</button>
        </div>
    </div>

    <!-- Admin Only: Spatial Surround Controls -->
    <div id="admin-surround-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 10px; font-size: 15px;">Admin Surround & Channel Mode</h3>
        <div class="control-group">
            <label>Speaker Channel Mode</label>
            <select id="channel-select" onchange="updateSpatialPanner()">
                <option value="center">Center / Stereo Mix</option>
                <option value="left">Left Speaker Only</option>
                <option value="right">Right Speaker Only</option>
                <option value="sub">Subwoofer / Bass Cutoff</option>
            </select>
        </div>
        <div class="control-group">
            <label>Stereo Panner (-1 Left to +1 Right)</label>
            <input type="range" id="pan-slider" min="-1" max="1" step="0.1" value="0" oninput="updatePan(this.value)">
        </div>
    </div>

    <!-- Available to Everyone: Visualizer & Volume Controls -->
    <div class="card">
        <div class="control-group">
            <label>Visualizer Effect Mode</label>
            <select id="vis-mode-select" onchange="visualizerMode = this.value">
                <option value="bars">Spectrum Frequency Bars</option>
                <option value="ring">Pulsing Bass Ring</option>
                <option value="party">RGB Party Strobe</option>
            </select>
        </div>

        <div class="control-group">
            <label>Local Device Volume: <span id="val-vol">100%</span></label>
            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="updateVolume(this.value)">
        </div>

        <button class="btn-resync" onclick="forceResync()">Force Manual Resync</button>
    </div>

    <!-- Audio & YouTube Embed Elements -->
    <audio id="audio-player" style="display: none;"></audio>
    <div id="yt-player-container"><div id="yt-player"></div></div>

    <script>
        const socket = io();
        let serverOffset = 0;
        let currentRole = 'unassigned';
        let currentSourceType = 'local';
        let currentPlaybackRate = 1.0;
        let visualizerMode = 'bars';

        const audioPlayer = document.getElementById('audio-player');

        // Web Audio API DSP Nodes
        let audioCtx;
        let sourceNode;
        let gainNode;
        let stereoPanner;
        let subLowPass;
        let analyserNode;
        let isAudioEngineInitialized = false;

        // YouTube IFrame Player Instance
        let ytPlayer;
        let isYtApiReady = false;

        // Canvas Visualizer Setup
        const canvas = document.getElementById('visualizer-canvas');
        const canvasCtx = canvas.getContext('2d');

        // Load YouTube Iframe API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: '',
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: {
                    'onReady': () => { isYtApiReady = true; }
                }
            });
        }

        function initAudioEngine() {
            if (isAudioEngineInitialized) return;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            gainNode = audioCtx.createGain();

            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 64;

            if (audioCtx.createStereoPanner) {
                stereoPanner = audioCtx.createStereoPanner();
            }

            subLowPass = audioCtx.createBiquadFilter();
            subLowPass.type = 'lowpass';
            subLowPass.frequency.value = 20000;

            let currentNode = sourceNode;
            currentNode.connect(analyserNode);
            currentNode = analyserNode;

            currentNode.connect(subLowPass);
            currentNode = subLowPass;

            if (stereoPanner) {
                currentNode.connect(stereoPanner);
                currentNode = stereoPanner;
            }

            currentNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            isAudioEngineInitialized = true;
            renderLightingVisualizer();
        }

        function renderLightingVisualizer() {
            requestAnimationFrame(renderLightingVisualizer);
            if (!analyserNode) return;

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyserNode.getByteFrequencyData(dataArray);

            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            let sum = 0;
            for (let i = 0; i < 8; i++) sum += dataArray[i];
            let bassAvg = sum / 8;
            let glowIntensity = Math.min(50, bassAvg / 2.5);

            canvas.style.boxShadow = `0 0 ${15 + glowIntensity}px rgba(88, 166, 255, ${0.3 + (glowIntensity / 70)})`;

            if (visualizerMode === 'ring') {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = 30;

                canvasCtx.beginPath();
                canvasCtx.arc(centerX, centerY, radius + (bassAvg / 15), 0, 2 * Math.PI);
                canvasCtx.strokeStyle = `hsl(${190 + (bassAvg / 3)}, 80%, 60%)`;
                canvasCtx.lineWidth = 4;
                canvasCtx.stroke();
            } else if (visualizerMode === 'bars') {
                const barWidth = (canvas.width / bufferLength) - 2;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    let barHeight = (dataArray[i] / 255) * canvas.height;
                    canvasCtx.fillStyle = `hsl(${200 + i * 8}, 80%, 60%)`;
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 2;
                }
            } else if (visualizerMode === 'party') {
                canvasCtx.fillStyle = `hsl(${bassAvg * 2.5}, 90%, ${Math.min(50, bassAvg / 2)}%)`;
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function measureLatency() {
            const start = Date.now();
            socket.emit('time-sync-ping', start);
        }

        socket.on('time-sync-pong', (data) => {
            const now = Date.now();
            const rtt = now - data.clientTime;
            const estimatedServerTime = data.serverTime + (rtt / 2);
            serverOffset = estimatedServerTime - now;
            document.getElementById('latency-display').innerText = `Latency Offset: ${Math.round(serverOffset)} ms`;
        });

        setInterval(measureLatency, 4000);

        function joinAs(role) {
            const password = document.getElementById('admin-passcode').value;
            document.getElementById('auth-error-msg').style.display = 'none';
            socket.emit('register-role', { role: role, password: password });
        }

        socket.on('role-assigned', (data) => {
            if (!data.success) {
                const errorEl = document.getElementById('auth-error-msg');
                errorEl.innerText = data.message || 'Authentication Failed!';
                errorEl.style.display = 'block';
                document.getElementById('status-display').innerText = 'Authentication Failed';
                document.getElementById('status-display').style.color = '#f85149';
                return;
            }

            currentRole = data.role;
            document.getElementById('role-display').innerText = data.role.toUpperCase();
            document.getElementById('status-display').innerText = 'Connected';
            document.getElementById('status-display').style.color = '#f2cc60';
            document.getElementById('role-selection').style.display = 'none';

            if (data.role === 'admin') {
                document.getElementById('admin-media-card').style.display = 'block';
                document.getElementById('admin-surround-card').style.display = 'block';
            }
            if (data.message) alert(data.message);
        });

        socket.on('stats-update', (stats) => {
            document.getElementById('stats-display').innerText = 
                `Devices: ${stats.totalDevices} | Admins: ${stats.adminCount}/2`;
        });

        function loadLocalAudioFile(event) {
            if (currentRole !== 'admin') return;
            initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const file = event.target.files[0];
            if (file) {
                currentSourceType = 'local';
                const objectUrl = URL.createObjectURL(file);
                audioPlayer.src = objectUrl;
                alert("Local audio file loaded!");
            }
        }

        function extractYouTubeId(url) {
            if (!url) return '';
            url = url.trim();
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=|shorts\/)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regExp);

            if (match && match[1]) {
                return match[1];
            }
            return url.length === 11 ? url : null;
        }

        function loadYouTubeSong() {
            if (currentRole !== 'admin') return;
            const inputVal = document.getElementById('yt-url-input').value;
            const ytId = extractYouTubeId(inputVal);

            if (!ytId) {
                alert("Invalid YouTube URL or Shorts link!");
                return;
            }

            currentSourceType = 'youtube';

            if (isYtApiReady && ytPlayer) {
                ytPlayer.cueVideoById(ytId);
                alert(`YouTube Video ID (${ytId}) cued across cluster!`);
            }
        }

        function changePlaybackRate(rate) {
            currentPlaybackRate = parseFloat(rate);
            if (currentRole === 'admin') {
                sendAdminAction('play');
            }
        }

        function sendAdminAction(action) {
            if (currentRole !== 'admin') return;

            let currentSeek = 0;
            let ytId = '';

            if (currentSourceType === 'local') {
                currentSeek = audioPlayer.currentTime || 0;
            } else if (currentSourceType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) {
                currentSeek = ytPlayer.getCurrentTime() || 0;
                ytId = extractYouTubeId(document.getElementById('yt-url-input').value);
            }

            socket.emit('admin-audio-action', {
                action: action,
                sourceType: currentSourceType,
                youtubeId: ytId,
                timestamp: Date.now() + serverOffset,
                seekPosition: currentSeek,
                playbackRate: currentPlaybackRate
            });
        }

        socket.on('audio-sync-receive', (data) => {
            currentSourceType = data.sourceType || 'local';
            currentPlaybackRate = data.playbackRate || 1.0;

            if (currentSourceType === 'local') {
                initAudioEngine();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();

                audioPlayer.playbackRate = currentPlaybackRate;

                if (data.action === 'play') {
                    const now = Date.now() + serverOffset;
                    const timePassed = ((now - data.startTimestamp) / 1000) * currentPlaybackRate;
                    const targetSeek = Math.max(0, data.seekPosition + timePassed);

                    if (Math.abs(audioPlayer.currentTime - targetSeek) > 0.08) {
                        audioPlayer.currentTime = targetSeek;
                    }
                    audioPlayer.play().catch(e => console.log("Tap screen to allow audio", e));
                } else if (data.action === 'pause') {
                    audioPlayer.pause();
                }
            } else if (currentSourceType === 'youtube' && isYtApiReady && ytPlayer) {
                audioPlayer.pause();

                if (ytPlayer.setPlaybackRate) {
                    ytPlayer.setPlaybackRate(currentPlaybackRate);
                }

                if (data.action === 'play') {
                    const now = Date.now() + serverOffset;
                    const timePassed = ((now - data.startTimestamp) / 1000) * currentPlaybackRate;
                    const targetSeek = Math.max(0, data.seekPosition + timePassed);

                    ytPlayer.loadVideoById(data.youtubeId, targetSeek);
                    ytPlayer.playVideo();
                } else if (data.action === 'pause') {
                    ytPlayer.pauseVideo();
                }
            }
        });

        function forceResync() {
            measureLatency();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            alert("Resynced network clock with master server!");
        }

        function updateSpatialPanner() {
            if (currentRole !== 'admin') return;
            if (!isAudioEngineInitialized) initAudioEngine();
            const mode = document.getElementById('channel-select').value;

            if (mode === 'left') {
                if (stereoPanner) stereoPanner.pan.value = -1;
                subLowPass.frequency.value = 20000;
            } else if (mode === 'right') {
                if (stereoPanner) stereoPanner.pan.value = 1;
                subLowPass.frequency.value = 20000;
            } else if (mode === 'center') {
                if (stereoPanner) stereoPanner.pan.value = 0;
                subLowPass.frequency.value = 20000;
            } else if (mode === 'sub') {
                if (stereoPanner) stereoPanner.pan.value = 0;
                subLowPass.frequency.value = 120;
            }
        }

        function updatePan(val) {
            if (currentRole !== 'admin') return;
            if (!isAudioEngineInitialized) initAudioEngine();
            if (stereoPanner) stereoPanner.pan.value = parseFloat(val);
        }

        function updateVolume(val) {
            if (currentSourceType === 'local') {
                if (!isAudioEngineInitialized) initAudioEngine();
                gainNode.gain.value = parseFloat(val);
            } else if (currentSourceType === 'youtube' && ytPlayer && ytPlayer.setVolume) {
                ytPlayer.setVolume(val * 100);
            }
            document.getElementById('val-vol').innerText = `${Math.round(val * 100)}%`;
        }
    </script>
</body>
</html>
