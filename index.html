<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Speaker Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --mute: #ef4444;
      --green: #22c55e;
      --mic: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 1.5rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: var(--panel); padding: 1rem; border-radius: 8px; border: 1px solid #334155; }
    .status { font-size: 0.85rem; color: #94a3b8; }
    .status.online { color: var(--green); }
    .badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: #334155; margin-left: 0.5rem; }
    .badge.admin { background: #0284c7; }
    .badge.muted { background: var(--mute); }
    .badge.live { background: var(--mic); }
    
    .card { width: 100%; max-width: 650px; background: var(--panel); padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; }
    audio { width: 100%; margin-top: 0.5rem; }

    .list-box { list-style: none; max-height: 350px; overflow-y: auto; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 0.5rem; }
    .device-card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .device-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; }
    .device-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #334155; }
    
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem; font-size: 0.8rem; border-bottom: 1px solid #1e293b; }
    .list-item.active { border-left: 3px solid var(--accent); background: #1e293b; font-weight: bold; }
    .item-title { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 200px; }
    .item-actions { display: flex; gap: 0.3rem; }

    input[type="text"], input[type="file"], input[type="password"] { width: 100%; padding: 0.5rem; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; font-size: 0.85rem; }

    .control-group { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
    .control-group label { color: #94a3b8; }
    input[type="range"] { width: 55%; }
    
    .btn { background: #0284c7; border: none; color: white; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .btn-sm { padding: 0.2rem 0.5rem; font-size: 0.75rem; }
    .btn-danger { background: var(--mute); }
    .btn-mic { background: var(--mic); font-weight: bold; }
    .btn-mic.active { background: #7e22ce; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .admin-only { display: none; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal-content { background: var(--panel); padding: 2rem; border-radius: 8px; border: 1px solid #334155; text-align: center; max-width: 320px; width: 90%; }
  </style>

  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div class="header">
    <div>
      <h2>Sync Speaker Studio</h2>
      <span id="roleBadge" class="badge">Listener Mode</span>
      <span id="muteIndicator" class="badge muted" style="display: none;">MUTED BY ADMIN</span>
      <span id="micLiveIndicator" class="badge live" style="display: none;">WEBRTC LIVE</span>
    </div>
    <div>
      <button id="btnAdmin" class="btn">Admin Login</button>
    </div>
  </div>

  <div class="card">
    <p id="nowPlayingText" style="font-size: 0.9rem; color: var(--accent); font-weight: bold;">Track: Default Demo Track</p>
    <p id="status" class="status">● Connecting...</p>
    
    <audio id="audioPlayer" controls crossOrigin="anonymous">
      <source id="audioSource" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Hidden audio tag for WebRTC stream processing -->
    <audio id="webrtcAudio" autoplay style="display:none;"></audio>
  </div>

  <div class="admin-only" id="adminContainer" style="width: 100%; max-width: 650px;">
    
    <!-- Admin Live Mic Control -->
    <div class="card">
      <h3>Live Studio Microphone (WebRTC Ultra-Low Latency)</h3>
      <button id="btnToggleMic" class="btn btn-mic">🎤 Start WebRTC Mic Broadcast</button>
    </div>

    <!-- Devices Control Center -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h4 style="font-size: 0.9rem; color: #94a3b8;">
          Connected Devices (<span id="deviceCount">0</span>)
        </h4>
        <button id="btnGlobalMute" class="btn btn-sm btn-danger">Mute All Devices</button>
      </div>
      <div id="deviceList" class="list-box"></div>
    </div>

    <!-- Song Queue -->
    <div class="card">
      <h3>Song Queue</h3>
      <ul id="queueList" class="list-box"></ul>
      
      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label style="font-size: 0.8rem; color: #94a3b8;">Upload Audio File (.mp3, .wav, .m4a)</label>
        <input type="file" id="songFileInput" accept="audio/*">
        <button id="btnAddSong" class="btn">Upload & Add to Queue</button>
      </div>
    </div>
  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Admin Authentication</h3>
      <input type="password" id="adminPassword" placeholder="Enter password...">
      <button id="btnSubmitPassword" class="btn" style="width: 100%; margin-top: 1rem;">Login</button>
    </div>
  </div>

  <script>
    const socket = io({
      transports: ['websocket'],
      upgrade: false,
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 500,
      reconnectionDelayMax: 1000,
      timeout: 5000
    });

    const audio = document.getElementById('audioPlayer');
    const audioSource = document.getElementById('audioSource');
    const webrtcAudio = document.getElementById('webrtcAudio');
    const status = document.getElementById('status');
    const roleBadge = document.getElementById('roleBadge');
    const muteIndicator = document.getElementById('muteIndicator');
    const micLiveIndicator = document.getElementById('micLiveIndicator');
    const adminContainer = document.getElementById('adminContainer');
    const queueList = document.getElementById('queueList');
    const deviceList = document.getElementById('deviceList');
    const deviceCount = document.getElementById('deviceCount');
    const nowPlayingText = document.getElementById('nowPlayingText');
    const btnGlobalMute = document.getElementById('btnGlobalMute');
    const btnToggleMic = document.getElementById('btnToggleMic');

    let isAdmin = false;
    let isGlobalMuted = false;
    let isDeviceMuted = false;
    let isMicActive = false;

    let peerConnections = {}; // Key: socketId -> RTCPeerConnection (Admin side)
    let listenerPeerConnection = null; // Single Peer Connection (Listener side)
    let micStream = null;

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    let isRemoteChange = false;
    let currentPlaylist = [];
    let currentSongIdx = 0;
    let connectedDevicesList = [];

    let audioCtx, source, masterMuteGain, chDelayNode, lowFilter, midFilter, highFilter, echoDelayNode, echoFeedbackGainNode;

    function initAudioContext() {
      if (audioCtx) return;

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtx();

      source = audioCtx.createMediaElementSource(audio);
      masterMuteGain = audioCtx.createGain();

      chDelayNode = audioCtx.createDelay(5.0); chDelayNode.delayTime.value = 0;
      lowFilter = audioCtx.createBiquadFilter(); lowFilter.type = "lowshelf"; lowFilter.frequency.value = 320;
      midFilter = audioCtx.createBiquadFilter(); midFilter.type = "peaking"; midFilter.frequency.value = 1000; midFilter.Q.value = 0.5;
      highFilter = audioCtx.createBiquadFilter(); highFilter.type = "highshelf"; highFilter.frequency.value = 3200;

      echoDelayNode = audioCtx.createDelay(5.0); echoDelayNode.delayTime.value = 0;
      echoFeedbackGainNode = audioCtx.createGain(); echoFeedbackGainNode.gain.value = 0;

      source.connect(chDelayNode);
      chDelayNode.connect(lowFilter);
      lowFilter.connect(midFilter);
      midFilter.connect(highFilter);
      highFilter.connect(masterMuteGain);

      masterMuteGain.connect(echoDelayNode);
      echoDelayNode.connect(echoFeedbackGainNode);
      echoFeedbackGainNode.connect(echoDelayNode);
      echoDelayNode.connect(audioCtx.destination);

      masterMuteGain.connect(audioCtx.destination);

      updateEffectiveGain();
    }

    function updateEffectiveGain() {
      const shouldMute = isGlobalMuted || isDeviceMuted;
      if (audioCtx && masterMuteGain) {
        masterMuteGain.gain.setValueAtTime(shouldMute ? 0 : 1, audioCtx.currentTime);
      }
      audio.muted = shouldMute;
      webrtcAudio.muted = shouldMute;
      muteIndicator.style.display = shouldMute ? 'inline-block' : 'none';
    }

    document.getElementById('btnAdmin').addEventListener('click', () => { document.getElementById('loginModal').style.display = 'flex'; });
    document.getElementById('btnSubmitPassword').addEventListener('click', () => {
      socket.emit('admin_login', { password: document.getElementById('adminPassword').value });
    });

    socket.on('login_result', (data) => {
      if (data.success) {
        isAdmin = true;
        document.getElementById('loginModal').style.display = 'none';
        adminContainer.style.display = 'block';
        roleBadge.textContent = 'Admin Mode';
        roleBadge.classList.add('admin');
        document.getElementById('btnAdmin').style.display = 'none';
        renderQueue();
      } else { alert(data.message); }
    });

    // --- WebRTC Logic (Admin Broadcasting) ---
    btnToggleMic.addEventListener('click', async () => {
      if (!isMicActive) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          isMicActive = true;
          btnToggleMic.textContent = '🛑 Stop WebRTC Mic Broadcast';
          btnToggleMic.classList.add('active');
          micLiveIndicator.style.display = 'inline-block';

          // Connect to each listener via WebRTC
          connectedDevicesList.forEach(dev => {
            if (dev.id !== socket.id) {
              startWebRTCPeer(dev.id);
            }
          });
        } catch (err) {
          alert('Microphone access denied: ' + err.message);
        }
      } else {
        stopMicBroadcasting();
      }
    });

    function stopMicBroadcasting() {
      if (micStream) micStream.getTracks().forEach(track => track.stop());
      Object.keys(peerConnections).forEach(id => {
        peerConnections[id].close();
      });
      peerConnections = {};
      isMicActive = false;
      btnToggleMic.textContent = '🎤 Start WebRTC Mic Broadcast';
      btnToggleMic.classList.remove('active');
      micLiveIndicator.style.display = 'none';
      socket.emit('stop_mic_broadcast');
    }

    async function startWebRTCPeer(targetId) {
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetId] = pc;

      micStream.getTracks().forEach(track => pc.addTrack(track, micStream));

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('webrtc_ice_candidate', { targetId, candidate: event.candidate });
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('webrtc_offer', { targetId, sdp: offer });
    }

    // --- WebRTC Signaling Listeners ---
    socket.on('webrtc_offer', async (data) => {
      // Listener receives call from Admin
      initAudioContext();
      if (listenerPeerConnection) listenerPeerConnection.close();

      listenerPeerConnection = new RTCPeerConnection(rtcConfig);

      listenerPeerConnection.ontrack = (event) => {
        webrtcAudio.srcObject = event.streams[0];
        micLiveIndicator.style.display = 'inline-block';
      };

      listenerPeerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('webrtc_ice_candidate', { targetId: data.senderId, candidate: event.candidate });
        }
      };

      await listenerPeerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
      const answer = await listenerPeerConnection.createAnswer();
      await listenerPeerConnection.setLocalDescription(answer);

      socket.emit('webrtc_answer', { targetId: data.senderId, sdp: answer });
    });

    socket.on('webrtc_answer', async (data) => {
      // Admin receives answer from listener
      const pc = peerConnections[data.senderId];
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      }
    });

    socket.on('webrtc_ice_candidate', async (data) => {
      const pc = isAdmin ? peerConnections[data.senderId] : listenerPeerConnection;
      if (pc) {
        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    socket.on('stop_webrtc_stream', () => {
      if (listenerPeerConnection) {
        listenerPeerConnection.close();
        listenerPeerConnection = null;
      }
      webrtcAudio.srcObject = null;
      micLiveIndicator.style.display = 'none';
    });

    // --- Device Controls & Setup ---
    btnGlobalMute.addEventListener('click', () => {
      if (isAdmin) socket.emit('toggle_global_mute');
    });

    socket.on('global_mute_state', (data) => {
      isGlobalMuted = data.isMuted;
      btnGlobalMute.textContent = isGlobalMuted ? 'Unmute All Devices' : 'Mute All Devices';
      btnGlobalMute.classList.toggle('active', isGlobalMuted);
      updateEffectiveGain();
    });

    socket.on('device_mute_state', (data) => {
      isDeviceMuted = data.isMuted;
      updateEffectiveGain();
    });

    socket.on('apply_device_audio_setting', (data) => {
      initAudioContext();
      const val = parseFloat(data.value);
      if (data.param === 'delay' && chDelayNode) chDelayNode.delayTime.value = val;
      if (data.param === 'eqLow' && lowFilter) lowFilter.gain.value = val;
      if (data.param === 'eqMid' && midFilter) midFilter.gain.value = val;
      if (data.param === 'eqHigh' && highFilter) highFilter.gain.value = val;
      if (data.param === 'echoTime' && echoDelayNode) echoDelayNode.delayTime.value = val;
      if (data.param === 'echoFeedback' && echoFeedbackGainNode) echoFeedbackGainNode.gain.value = Math.min(val, 0.85);
    });

    socket.on('device_list_update', (data) => {
      deviceCount.textContent = data.total;
      connectedDevicesList = data.devices;
      deviceList.innerHTML = '';
      
      data.devices.forEach(device => {
        const isSelf = device.id === socket.id;
        const div = document.createElement('div');
        div.className = 'device-card';
        
        let controlsHtml = '';
        if (isAdmin && !device.isAdmin) {
          controlsHtml = `
            <div class="device-controls">
              <div class="control-group"><label>Delay</label><input type="range" min="0" max="2" step="0.05" value="${device.settings.delay}" onchange="updateDeviceAudio('${device.id}', 'delay', this.value)"></div>
              <div class="control-group"><label>EQ Low</label><input type="range" min="-12" max="12" step="1" value="${device.settings.eqLow}" onchange="updateDeviceAudio('${device.id}', 'eqLow', this.value)"></div>
              <div class="control-group"><label>EQ Mid</label><input type="range" min="-12" max="12" step="1" value="${device.settings.eqMid}" onchange="updateDeviceAudio('${device.id}', 'eqMid', this.value)"></div>
              <div class="control-group"><label>EQ High</label><input type="range" min="-12" max="12" step="1" value="${device.settings.eqHigh}" onchange="updateDeviceAudio('${device.id}', 'eqHigh', this.value)"></div>
              <div class="control-group"><label>Echo Time</label><input type="range" min="0" max="1" step="0.05" value="${device.settings.echoTime}" onchange="updateDeviceAudio('${device.id}', 'echoTime', this.value)"></div>
              <div class="control-group"><label>Echo Repeat</label><input type="range" min="0" max="0.8" step="0.05" value="${device.settings.echoFeedback}" onchange="updateDeviceAudio('${device.id}', 'echoFeedback', this.value)"></div>
            </div>`;
        }

        div.innerHTML = `
          <div class="device-header">
            <span>ID: ${device.id.substring(0, 8)}... ${isSelf ? '(You)' : ''} ${device.isMuted ? '🔇' : ''}</span>
            <div class="item-actions">
              <span style="margin-right: 0.3rem;">${device.isAdmin ? '👑 Admin' : '🎧 Listener'}</span>
              ${isAdmin && !device.isAdmin ? `<button class="btn btn-sm ${device.isMuted ? '' : 'btn-danger'}" onclick="toggleDeviceMute('${device.id}')">${device.isMuted ? 'Unmute' : 'Mute'}</button>` : ''}
            </div>
          </div>
          ${controlsHtml}
        `;
        deviceList.appendChild(div);
      });
    });

    window.toggleDeviceMute = (targetId) => { socket.emit('toggle_device_mute', targetId); };
    window.updateDeviceAudio = (targetId, param, value) => { socket.emit('update_device_audio_setting', { targetId, param, value }); };

    document.getElementById('btnAddSong').addEventListener('click', () => {
      const fileInput = document.getElementById('songFileInput');
      const btn = document.getElementById('btnAddSong');
      const file = fileInput.files[0];
      if (!file) { alert("Please select an audio file first!"); return; }

      btn.disabled = true; btn.textContent = "Processing File...";
      const reader = new FileReader();
      reader.onload = (e) => {
        socket.emit('add_to_queue', { id: 'song-' + Date.now(), title: file.name, url: e.target.result });
        fileInput.value = ''; btn.disabled = false; btn.textContent = "Upload & Add to Queue";
      };
      reader.onerror = () => { alert("Error reading file"); btn.disabled = false; btn.textContent = "Upload & Add to Queue"; };
      reader.readAsDataURL(file);
    });

    socket.on('queue_update', (data) => { currentPlaylist = data.playlist; currentSongIdx = data.currentSongIndex; renderQueue(); });

    socket.on('change_track', (data) => {
      isRemoteChange = true; audioSource.src = data.song.url; audio.load();
      nowPlayingText.textContent = `Track: ${data.song.title}`;
      audio.play().then(() => { isRemoteChange = false; }).catch(() => { isRemoteChange = false; });
    });

    function renderQueue() {
      queueList.innerHTML = '';
      currentPlaylist.forEach((song, idx) => {
        const li = document.createElement('li');
        li.className = `list-item ${idx === currentSongIdx ? 'active' : ''}`;
        let controlsHtml = '';
        if (isAdmin) {
          controlsHtml = `
            <div class="item-actions">
              <button class="btn btn-sm" onclick="selectSong(${idx})">Play</button>
              <button class="btn btn-sm btn-danger" onclick="removeSong(${idx})">✕</button>
            </div>`;
        }
        li.innerHTML = `<span class="item-title">${idx + 1}. ${song.title}</span>${controlsHtml}`;
        queueList.appendChild(li);
      });
    }

    window.selectSong = (index) => { socket.emit('select_song', index); };
    window.removeSong = (index) => { socket.emit('remove_from_queue', index); };

    socket.on('connect', () => { status.textContent = '● Connected'; status.className = 'status online'; });
    socket.on('disconnect', () => { status.textContent = '● Reconnecting...'; status.className = 'status'; });

    socket.on('play', (data) => { initAudioContext(); isRemoteChange = true; audio.currentTime = data.time; audio.play().then(() => { isRemoteChange = false; }); });
    socket.on('pause', (data) => { isRemoteChange = true; audio.currentTime = data.time; audio.pause(); isRemoteChange = false; });
    socket.on('seek', (data) => { isRemoteChange = true; audio.currentTime = data.time; isRemoteChange = false; });

    audio.addEventListener('play', () => {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (isAdmin && !isRemoteChange) socket.emit('play', { time: audio.currentTime });
    });
    audio.addEventListener('pause', () => { if (isAdmin && !isRemoteChange) socket.emit('pause', { time: audio.currentTime }); });
    audio.addEventListener('seeked', () => { if (isAdmin && !isRemoteChange) socket.emit('seek', { time: audio.currentTime }); });

    audio.addEventListener('ended', () => {
      if (isAdmin && currentSongIdx + 1 < currentPlaylist.length) selectSong(currentSongIdx + 1);
    });
  </script>
</body>
</html>
