<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Speaker Studio</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0b0e14; 
            color: #c9d1d9; 
            text-align: center; 
            padding: 15px; 
            transition: background 0.2s ease;
        }
        h1 { margin: 8px 0; color: #58a6ff; font-size: 22px; }
        .card { 
            background: rgba(22, 27, 34, 0.95); 
            border: 1px solid #30363d; 
            border-radius: 10px; 
            padding: 14px; 
            margin: 10px auto; 
            max-width: 540px; 
            text-align: left; 
            backdrop-filter: blur(8px);
        }
        .center { text-align: center; }
        .status-val { font-weight: bold; color: #f2cc60; }
        .error-msg { color: #f85149; font-weight: bold; font-size: 13px; margin-top: 6px; display: none; }
        button { padding: 10px 14px; margin: 4px 0; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-admin { background: #238636; color: white; }
        .btn-listener { background: #1f6feb; color: white; }
        .btn-play { background: #238636; color: white; margin-top: 6px; font-size: 14px; }
        .btn-pause { background: #da3633; color: white; font-size: 14px; }
        .btn-warning { background: #d29922; color: #0d1117; font-weight: bold; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-active { background: #1f6feb !important; color: white !important; border-color: #58a6ff !important; }
        label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 3px; font-weight: 600; text-transform: uppercase; }
        input[type="range"] { width: 100%; margin: 3px 0; accent-color: #58a6ff; }
        input[type="text"], input[type="password"], select, input[type="file"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; margin-bottom: 8px; font-size: 13px; }
        .info-text { font-size: 12px; color: #8b949e; }
        
        .device-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 12px; }
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .device-id { font-weight: bold; color: #58a6ff; }
        .eq-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
        .canvas-spectrum { width: 100%; height: 35px; background: #161b22; border-radius: 4px; margin-top: 6px; }
        
        .timeline-container { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .timeline-time { font-size: 11px; font-family: monospace; color: #8b949e; }

        .playlist-container { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; max-height: 180px; overflow-y: auto; margin-top: 8px; }
        .playlist-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #21262d; font-size: 12px; cursor: pointer; }
        .playlist-item:hover { background: #161b22; }
        .playlist-item.active { background: #1f6feb22; border-left: 3px solid #58a6ff; font-weight: bold; color: #58a6ff; }
        .remove-btn { background: transparent; color: #f85149; border: none; width: auto; padding: 2px 6px; margin: 0; font-size: 14px; cursor: pointer; }
        
        .controls-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>Sync Speaker Studio</h1>

    <!-- Network Info -->
    <div class="card center">
        <p>Room: <span id="room-display" class="status-val">MainStudio</span> | Role: <span id="role-display" class="status-val">Unassigned</span></p>
        <p id="latency-display" class="info-text" style="margin-top: 4px;">Latency: 0 ms</p>
    </div>

    <!-- Role & Room Selection -->
    <div id="role-selection" class="card">
        <h3 style="margin-bottom: 12px; text-align: center;">Join Studio Session</h3>
        
        <label>Room Identifier:</label>
        <input type="text" id="room-id-input" value="MainStudio" placeholder="e.g. LivingRoom">

        <div style="margin-bottom: 12px;">
            <label>Admin Password:</label>
            <input type="password" id="admin-passcode" placeholder="Default: 1234">
            <button class="btn-admin" onclick="joinAs('admin')">Login as Admin Controller</button>
        </div>

        <hr style="border-color: #30363d; margin: 12px 0;">

        <div style="margin-bottom: 6px;">
            <label>Listener Password:</label>
            <input type="password" id="listener-passcode" placeholder="Default: listenpass">
            <button class="btn-listener" onclick="joinAs('listener')">Join as Listener</button>
        </div>

        <p id="auth-error-msg" class="error-msg center"></p>
    </div>

    <!-- Connected Devices & DSP -->
    <div id="admin-devices-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 8px; font-size: 15px;">📱 Connected Nodes & Visualizers</h3>
        
        <div style="display: flex; gap: 6px; margin-bottom: 10px;">
            <button class="btn-warning" onclick="sendGlobalMute(true)">Mute All Devices</button>
            <button class="btn-secondary" onclick="sendGlobalMute(false)">Unmute All</button>
        </div>

        <div id="connected-devices-container">
            <p class="info-text">Scanning network for connected devices...</p>
        </div>
    </div>

    <!-- Admin Master Controller & Playlist -->
    <div id="admin-media-card" class="card" style="display: none;">
        <h3 style="color: #58a6ff; margin-bottom: 8px; font-size: 15px;">🎼 Master Controller & Playlist</h3>
        
        <label>Add Audio Files to Playlist</label>
        <input type="file" id="audio-file-input" accept="audio/*" multiple onchange="addFilesToPlaylist(event)">

        <p id="current-track-label" class="info-text" style="color: #f2cc60; font-weight: bold; margin-top: 4px;">Track: No File Loaded</p>

        <!-- Playlist UI -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <label style="margin:0;">Session Playlist</label>
            <button id="repeat-btn" class="btn-secondary" style="width: auto; padding: 4px 10px; font-size: 11px;" onclick="toggleRepeat()">🔁 Repeat: OFF</button>
        </div>
        
        <div id="playlist-container" class="playlist-container">
            <p class="info-text" style="padding: 10px;">No tracks in playlist.</p>
        </div>

        <!-- Timeline Seeking -->
        <div class="timeline-container">
            <span id="curr-time-display" class="timeline-time">00:00</span>
            <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1" onchange="seekTrack(this.value)">
            <span id="total-time-display" class="timeline-time">00:00</span>
        </div>

        <!-- Master Transport Buttons -->
        <div style="margin-top: 8px; display: flex; gap: 6px;">
            <button class="btn-play" onclick="sendAdminAction('play')">PLAY / RESYNC</button>
            <button class="btn-pause" onclick="sendAdminAction('pause')">PAUSE</button>
            <button class="btn-secondary" style="margin-top: 6px;" onclick="nextTrack()">SKIP NEXT ⏭</button>
        </div>

        <!-- Playback Rate & Volume -->
        <div class="controls-row">
            <div style="flex: 1;">
                <label>Playback Speed</label>
                <select id="playback-rate-select" onchange="updatePlaybackRate(this.value)">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1.0" selected>1.0x (Normal)</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2.0">2.0x</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label>Master Gain Volume</label>
                <input type="range" id="master-vol-slider" min="0" max="1" step="0.05" value="1" onchange="updateMasterVolume(this.value)">
            </div>
        </div>

        <!-- Spatial Auto-Panning -->
        <div style="margin-top: 10px;">
            <label>🔄 Spatial Auto-Panning Engine</label>
            <div style="display: flex; gap: 6px; align-items: center;">
                <button id="auto-pan-btn" class="btn-secondary" onclick="toggleAutoPan()">Enable Panning Engine</button>
                <input type="range" id="pan-speed-slider" min="0.1" max="3" step="0.1" value="1" onchange="updatePanSpeed(this.value)">
            </div>
        </div>
    </div>

    <!-- Visualizer & Background Lighting Toggle -->
    <div class="card center">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="margin: 0;">Local Frequency Visualizer</label>
            <button id="bg-light-btn" class="btn-secondary" style="width: auto; padding: 4px 10px; font-size: 11px;" onclick="toggleBgLighting()">💡 Dynamic Background Lighting: OFF</button>
        </div>
        <canvas id="local-spectrum-canvas" width="300" height="60" style="background:#0d1117; border-radius:6px; width:100%;"></canvas>
    </div>

    <audio id="audio-player" style="display: none;"></audio>

    <script>
        const socket = io();
        let currentRole = 'unassigned';
        let currentRoomId = 'MainStudio';
        let serverOffset = 0;

        const audioPlayer = document.getElementById('audio-player');
        let audioCtx, sourceNode, gainNode, bassFilter, midFilter, trebleFilter, stereoPanner, analyserNode;
        let isAudioInit = false;

        let localFileStore = [];
        let activePlaylist = [];
        let activeTrackIndex = -1;

        let autoPanSettings = { enabled: false, speed: 1.0 };
        let panAngle = 0;
        let bgLightingEnabled = false;

        document.body.addEventListener('click', () => {
            if (!isAudioInit) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: false });

        // Fully Independent Audio DSP Setup
        function initAudio() {
            if (isAudioInit) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            gainNode = audioCtx.createGain();

            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 64;

            // Low-shelf filter for independent Bass
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.value = 200;
            bassFilter.gain.value = 0;

            // Peaking filter for independent Midrange
            midFilter = audioCtx.createBiquadFilter();
            midFilter.type = 'peaking';
            midFilter.frequency.value = 1000;
            midFilter.Q.value = 1.0;
            midFilter.gain.value = 0;

            // High-shelf filter for independent Treble
            trebleFilter = audioCtx.createBiquadFilter();
            trebleFilter.type = 'highshelf';
            trebleFilter.frequency.value = 3000;
            trebleFilter.gain.value = 0;

            if (audioCtx.createStereoPanner) {
                stereoPanner = audioCtx.createStereoPanner();
            }

            // Route sequentially: Source -> Bass -> Mid -> Treble -> Analyser
            sourceNode.connect(bassFilter);
            bassFilter.connect(midFilter);
            midFilter.connect(trebleFilter);
            trebleFilter.connect(analyserNode);

            let lastNode = analyserNode;
            if (stereoPanner) {
                analyserNode.connect(stereoPanner);
                lastNode = stereoPanner;
            }

            lastNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            isAudioInit = true;
            renderLocalVisualizerAndStream();
        }

        function toggleBgLighting() {
            bgLightingEnabled = !bgLightingEnabled;
            const btn = document.getElementById('bg-light-btn');
            btn.innerText = bgLightingEnabled ? "💡 Dynamic Background Lighting: ON" : "💡 Dynamic Background Lighting: OFF";
            btn.classList.toggle('btn-active', bgLightingEnabled);
            if (!bgLightingEnabled) {
                document.body.style.background = "#0b0e14";
            }
        }

        function renderLocalVisualizerAndStream() {
            requestAnimationFrame(renderLocalVisualizerAndStream);
            if (!analyserNode) return;

            const canvas = document.getElementById('local-spectrum-canvas');
            const ctx = canvas.getContext('2d');
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            analyserNode.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) - 2;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                ctx.fillStyle = `hsl(${200 + i * 10}, 80%, 60%)`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }

            // Reactive Background Lighting
            if (bgLightingEnabled) {
                const bassVal = dataArray[1] || 0;
                const trebleVal = dataArray[12] || 0;
                const red = Math.floor((bassVal / 255) * 60);
                const blue = Math.floor((trebleVal / 255) * 80);
                document.body.style.background = `rgb(${red}, 14, ${20 + blue})`;
            }

            const compressedSpectrum = Array.from(dataArray.slice(0, 16));
            socket.emit('device-spectrum-stream', compressedSpectrum);

            if (autoPanSettings.enabled && stereoPanner) {
                panAngle += 0.02 * autoPanSettings.speed;
                stereoPanner.pan.value = Math.sin(panAngle);
            }
        }

        function joinAs(role) {
            currentRoomId = document.getElementById('room-id-input').value || 'MainStudio';
            const password = role === 'admin' 
                ? document.getElementById('admin-passcode').value 
                : document.getElementById('listener-passcode').value;

            document.getElementById('auth-error-msg').style.display = 'none';
            socket.emit('register-role', { role: role, password: password, roomId: currentRoomId });
        }

        socket.on('role-assigned', (data) => {
            if (!data.success) {
                const errorEl = document.getElementById('auth-error-msg');
                errorEl.innerText = data.message;
                errorEl.style.display = 'block';
                return;
            }

            currentRole = data.role;
            document.getElementById('room-display').innerText = data.roomId;
            document.getElementById('role-display').innerText = data.role.toUpperCase();
            document.getElementById('role-selection').style.display = 'none';

            if (data.role === 'admin') {
                document.getElementById('admin-media-card').style.display = 'block';
                document.getElementById('admin-devices-card').style.display = 'block';
            }
        });

        function addFilesToPlaylist(e) {
            const files = Array.from(e.target.files);
            const trackMetas = [];

            files.forEach(file => {
                localFileStore.push(file);
                trackMetas.push({ name: file.name, duration: 0 });
            });

            socket.emit('admin-add-to-playlist', trackMetas);
        }

        socket.on('playlist-update', (data) => {
            activePlaylist = data.playlist;
            activeTrackIndex = data.currentIndex;
            
            const repeatBtn = document.getElementById('repeat-btn');
            if (repeatBtn) {
                repeatBtn.innerText = data.isRepeat ? "🔁 Repeat: ON" : "🔁 Repeat: OFF";
                repeatBtn.classList.toggle('btn-active', data.isRepeat);
            }
            
            renderPlaylistUI();
        });

        function renderPlaylistUI() {
            const container = document.getElementById('playlist-container');
            if (!activePlaylist || activePlaylist.length === 0) {
                container.innerHTML = '<p class="info-text" style="padding: 10px;">No tracks in playlist.</p>';
                return;
            }

            container.innerHTML = activePlaylist.map((track, i) => `
                <div class="playlist-item ${i === activeTrackIndex ? 'active' : ''}" onclick="playTrackIndex(${i})">
                    <span>${i + 1}. ${track.name}</span>
                    ${currentRole === 'admin' ? `<button class="remove-btn" onclick="removeTrack(event, ${i})">✕</button>` : ''}
                </div>
            `).join('');

            if (activeTrackIndex >= 0 && activePlaylist[activeTrackIndex]) {
                document.getElementById('current-track-label').innerText = `Track: ${activePlaylist[activeTrackIndex].name}`;
            }
        }

        function playTrackIndex(index) {
            if (currentRole !== 'admin') return;
            if (localFileStore[index]) {
                audioPlayer.src = URL.createObjectURL(localFileStore[index]);
            }
            socket.emit('admin-select-track', index);
        }

        function removeTrack(e, index) {
            e.stopPropagation();
            if (currentRole !== 'admin') return;
            localFileStore.splice(index, 1);
            socket.emit('admin-remove-playlist-item', index);
        }

        function toggleRepeat() {
            if (currentRole !== 'admin') return;
            socket.emit('admin-toggle-repeat');
        }

        function nextTrack() {
            if (currentRole !== 'admin') return;
            if (activeTrackIndex + 1 < activePlaylist.length) {
                playTrackIndex(activeTrackIndex + 1);
            }
        }

        audioPlayer.addEventListener('ended', () => {
            if (currentRole === 'admin') {
                socket.emit('track-ended-auto-next');
            }
        });

        // Connected Device Monitor
        socket.on('device-list-update', (devices) => {
            if (currentRole !== 'admin') return;

            const container = document.getElementById('connected-devices-container');
            if (devices.length === 0) {
                container.innerHTML = '<p class="info-text">No connected nodes.</p>';
                return;
            }

            container.innerHTML = devices.map(dev => `
                <div class="device-card">
                    <div class="device-header">
                        <span class="device-id">${dev.id.substring(0, 6)}... (${dev.role.toUpperCase()})</span>
                        <span class="info-text">Latency: ${dev.latency}ms</span>
                    </div>

                    <canvas id="canvas-spec-${dev.id}" class="canvas-spectrum" width="200" height="35"></canvas>

                    <div style="margin-top: 6px;">
                        <label>Spatial Channel</label>
                        <select onchange="updateDeviceDSP('${dev.id}', 'channel', this.value)">
                            <option value="center" ${dev.channel === 'center' ? 'selected' : ''}>Center / Stereo</option>
                            <option value="left" ${dev.channel === 'left' ? 'selected' : ''}>Left Speaker</option>
                            <option value="right" ${dev.channel === 'right' ? 'selected' : ''}>Right Speaker</option>
                            <option value="sub" ${dev.channel === 'sub' ? 'selected' : ''}>Bass Subwoofer</option>
                        </select>
                    </div>

                    <div style="margin-top: 4px;">
                        <label>Node Gain Volume</label>
                        <input type="range" min="0" max="1" step="0.05" value="${dev.isMuted ? 0 : dev.volume}" onchange="updateDeviceDSP('${dev.id}', 'volume', parseFloat(this.value))">
                    </div>

                    <!-- Independent EQ Sliders -->
                    <div class="eq-grid">
                        <div><label>Bass</label><input type="range" min="-12" max="12" value="${dev.eq.bass}" onchange="updateDeviceEQ('${dev.id}', 'bass', this.value)"></div>
                        <div><label>Mid</label><input type="range" min="-12" max="12" value="${dev.eq.mid}" onchange="updateDeviceEQ('${dev.id}', 'mid', this.value)"></div>
                        <div><label>Treble</label><input type="range" min="-12" max="12" value="${dev.eq.treble}" onchange="updateDeviceEQ('${dev.id}', 'treble', this.value)"></div>
                    </div>
                </div>
            `).join('');
        });

        socket.on('spectrum-stream-broadcast', (data) => {
            if (currentRole !== 'admin') return;
            const targetCanvas = document.getElementById(`canvas-spec-${data.id}`);
            if (!targetCanvas) return;

            const ctx = targetCanvas.getContext('2d');
            ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
            const barWidth = (targetCanvas.width / data.spectrumData.length) - 1;

            data.spectrumData.forEach((val, i) => {
                const h = (val / 255) * targetCanvas.height;
                ctx.fillStyle = '#58a6ff';
                ctx.fillRect(i * (barWidth + 1), targetCanvas.height - h, barWidth, h);
            });
        });

        function updateDeviceDSP(targetId, key, value) {
            const payload = { targetDeviceId: targetId };
            payload[key] = value;
            socket.emit('admin-target-device-dsp', payload);
        }

        // Independent EQ Updates
        function updateDeviceEQ(targetId, band, val) {
            const eqObj = {};
            eqObj[band] = parseFloat(val);
            socket.emit('admin-target-device-dsp', {
                targetDeviceId: targetId,
                eq: eqObj
            });
        }

        function sendGlobalMute(shouldMute) {
            socket.emit('admin-global-mute', shouldMute);
        }

        function updatePlaybackRate(rateStr) {
            if (currentRole !== 'admin') return;
            const rate = parseFloat(rateStr);
            audioPlayer.playbackRate = rate;
            sendAdminAction('play');
        }

        function updateMasterVolume(val) {
            if (gainNode) {
                gainNode.gain.value = parseFloat(val);
            }
        }

        function toggleAutoPan() {
            autoPanSettings.enabled = !autoPanSettings.enabled;
            document.getElementById('auto-pan-btn').innerText = autoPanSettings.enabled ? "Disable Panning" : "Enable Panning Engine";
            socket.emit('admin-toggle-auto-pan', autoPanSettings);
        }

        function updatePanSpeed(val) {
            autoPanSettings.speed = parseFloat(val);
            socket.emit('admin-toggle-auto-pan', autoPanSettings);
        }

        socket.on('auto-pan-state-update', (settings) => {
            autoPanSettings = settings;
        });

        // Apply Independent Local DSP
        socket.on('apply-custom-dsp', (dsp) => {
            if (!isAudioInit) initAudio();

            if (stereoPanner && !autoPanSettings.enabled) {
                if (dsp.channel === 'left') stereoPanner.pan.value = -1;
                else if (dsp.channel === 'right') stereoPanner.pan.value = 1;
                else stereoPanner.pan.value = 0;
            }

            if (dsp.isMuted) gainNode.gain.value = 0;
            else if (dsp.volume !== undefined) gainNode.gain.value = dsp.volume;

            if (dsp.eq) {
                if (dsp.eq.bass !== undefined) bassFilter.gain.value = dsp.eq.bass;
                if (dsp.eq.mid !== undefined) midFilter.gain.value = dsp.eq.mid;
                if (dsp.eq.treble !== undefined) trebleFilter.gain.value = dsp.eq.treble;
            }
        });

        // Time synchronization
        setInterval(() => {
            const start = Date.now();
            socket.emit('time-sync-ping', start);
        }, 4000);

        socket.on('time-sync-pong', (data) => {
            const now = Date.now();
            const rtt = now - data.clientTime;
            serverOffset = (data.serverTime + (rtt / 2)) - now;
            document.getElementById('latency-display').innerText = `Latency: ${Math.round(rtt / 2)} ms`;
            socket.emit('report-latency', rtt / 2);
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60) || 0;
            const s = Math.floor(secs % 60) || 0;
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function seekTrack(value) {
            if (currentRole !== 'admin') return;
            audioPlayer.currentTime = parseFloat(value);
            sendAdminAction('play');
        }

        audioPlayer.addEventListener('timeupdate', () => {
            document.getElementById('curr-time-display').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('seek-slider').value = audioPlayer.currentTime;
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            document.getElementById('total-time-display').innerText = formatTime(audioPlayer.duration);
            document.getElementById('seek-slider').max = audioPlayer.duration;
        });

        function sendAdminAction(action) {
            if (currentRole !== 'admin') return;
            const rateSelect = document.getElementById('playback-rate-select');
            socket.emit('admin-audio-action', {
                action: action,
                timestamp: Date.now() + serverOffset,
                seekPosition: audioPlayer.currentTime || 0,
                playbackRate: rateSelect ? parseFloat(rateSelect.value) : 1.0,
                duration: audioPlayer.duration || 0
            });
        }

        socket.on('audio-sync-receive', async (data) => {
            if (!isAudioInit) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

            if (data.playbackRate) {
                audioPlayer.playbackRate = data.playbackRate;
                const rateSelect = document.getElementById('playback-rate-select');
                if (rateSelect) rateSelect.value = data.playbackRate.toString();
            }

            if (data.action === 'play-track-index') {
                if (localFileStore[data.index]) {
                    audioPlayer.src = URL.createObjectURL(localFileStore[data.index]);
                }
                const now = Date.now() + serverOffset;
                const passed = ((now - data.startTimestamp) / 1000) * (data.playbackRate || 1.0);
                audioPlayer.currentTime = Math.max(0, data.seekPosition + passed);
                audioPlayer.play().catch(e => console.log(e));
            } else if (data.action === 'play') {
                const now = Date.now() + serverOffset;
                const passed = ((now - data.startTimestamp) / 1000) * (data.playbackRate || 1.0);
                audioPlayer.currentTime = Math.max(0, data.seekPosition + passed);
                audioPlayer.play().catch(e => console.log(e));
            } else {
                audioPlayer.pause();
            }
        });
    </script>
</body>
</html>
